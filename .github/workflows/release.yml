name: Windows release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Validate release tag
        shell: pwsh
        run: |
          [xml]$props = Get-Content Directory.Build.props -Raw
          $version = [string]$props.Project.PropertyGroup.Version
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
            if ($tag -ne "v$version" -and $tag -ne ('v' + $version -replace '\.0$', '')) {
              throw "Tag $tag does not match project version $version"
            }
          }
      - run: dotnet restore Egorik.slnx
      - run: dotnet build Egorik.slnx -c Release --no-restore
      - run: dotnet test Egorik.slnx -c Release --no-build --no-restore
      - run: dotnet format Egorik.slnx --verify-no-changes --no-restore
      - name: Package portable application
        shell: pwsh
        run: ./scripts/Publish-Release.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: artifacts/releases/*
          if-no-files-found: error

  draft-release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-release
          path: artifacts/releases
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          gh release create "$RELEASE_TAG" artifacts/releases/*
          --verify-tag --draft --title "Egorik $RELEASE_TAG"
          --notes-file CHANGELOG.md
